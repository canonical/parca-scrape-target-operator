name: parca-scrape-target

summary: An integrator charm for external profiling endpoints.

description: |
  Parca Scrape Target is a workloadless Juju charm that acts as an integrator for
  profiling endpoints that exist outside the Juju model. It is an optional complement
  to the Canonical Observability Stack (COS):
  https://documentation.ubuntu.com/observability

  Parca is an open-source continuous profiling backend. The preferred way to integrate
  an application with Parca is to relate it directly within the Juju model using the
  parca_scrape interface. However, when the profiling target runs outside Juju — for
  example, a pre-existing service on a bare-metal host or in another infrastructure —
  this charm bridges the gap.

  This charm carries no workload of its own. It is configured with one or more external
  target addresses and exposes them to a Parca or parca-k8s charm via the
  profiling-endpoint relation.

  Key features:

  - Workloadless integrator: no containers or services to manage.
  - Bridges external (non-Juju) profiling endpoints into the Juju model via the
    parca_scrape interface.
  - Configurable list of scrape targets (host:port) via Juju config.
  - Configurable scrape scheme (http/https) and TLS settings, including custom CA
    certificate, server name override, and insecure skip verify.

type: charm

links:
  documentation: https://discourse.charmhub.io/t/16555
  website: https://charmhub.io/parca-scrape-target
  source: https://github.com/canonical/parca-scrape-target-operator
  issues: https://github.com/canonical/parca-scrape-target-operator/issues

platforms:
  ubuntu@24.04:amd64:
  ubuntu@26.04:amd64:

assumes:
  - juju >= 3.6

parts:
  charm:
    source: .
    plugin: uv
    build-snaps: [astral-uv]
    build-packages:
      - git
      - cargo
      - rustc
    override-build: |
      craftctl default
      git describe --always > $CRAFT_PART_INSTALL/version

provides:
  profiling-endpoint:
    interface: parca_scrape

config: 
  options:
    targets:
      description: Comma separated list of external scrape targets, e.g., "192.168.5.2:7000,192.168.5.3:7000"; do not add the protocol!
      type: string
      default: ""
    scheme:
      type: string
      description: >
        Configures the protocol scheme that would be used for scraping the targets.
    tls_ca_cert:
      type: string
      description: >
        CA certificate to validate the targets' server certificates with.
        reference: https://prometheus.io/docs/prometheus/latest/configuration/configuration/#tls_config
    tls_insecure_skip_verify:
      type: boolean
      description: >
        Disable server certificate validation for the targets.
        reference: https://prometheus.io/docs/prometheus/latest/configuration/configuration/#tls_config
    tls_server_name:
      type: string
      description: >
        Server name to verify the hostname of the targets. 
        Only relevant if the target's cert does not include its name in the SANs.
        reference: https://prometheus.io/docs/prometheus/latest/configuration/configuration/#tls_config
